<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind labelling: criterion 06</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#dcdcd5;--blue:#1f5fbf;--ok:#1b7a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Inter,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 90px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 14px}
.crit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}.crit h2{margin:0 0 6px;font-size:17px}
.crit ol{margin:6px 0 0;padding-left:0;list-style:none}.crit li{margin:3px 0}.crit b{display:inline-block;min-width:26px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar progress{flex:1;min-width:140px;height:10px}.bar button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.bar button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.case{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:16px 0;overflow:hidden}.case header{padding:10px 14px;background:#efefea;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.case header h3{margin:0;font-size:16px}.chip{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--mute)}
.tr{padding:8px 4px;font-size:14px;max-height:420px;overflow:auto;border-bottom:1px solid var(--line)}
.msg{display:flex;gap:8px;padding:2px 10px}.mi{width:34px;color:var(--mute);flex:none}.ts{width:78px;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}.sp{width:66px;flex:none;color:var(--mute)}
.msg.client .sp{color:#7a4b00}.msg.operator .sp{color:#0b5b8c}.msg.system,.msg.bot{color:var(--mute)}
.choose{padding:12px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}.choose label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.choose label:has(input:checked){border-color:var(--blue);background:#e8f0ff}.choose input[type=text]{flex:1;min-width:200px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.done{color:var(--ok);font-weight:600}
</style></head><body><main>
<h1>Blind labelling: criterion 06</h1>
<p class="sub">For each conversation choose the step that fits the operator. You are not shown any model answer or earlier label. If you cannot decide, tick "unsure" and note why. Answers autosave in this browser.</p>
<div class="crit" id="crit"></div>
<div class="bar"><progress id="prog" max="1" value="0"></progress><span id="count"></span><button class="primary" id="dl">Download answers</button></div>

</main>
<script>
const DATA = {"criterion": {"id": "06", "title": "Управление диалогом, скорость и грамотность", "description": "Оцените ясность, порядок ответов и предупреждение об ожидании по шкале", "steps": [{"value": 0, "descriptor": "Из-за бессвязных или противоречивых реплик ход диалога непонятен"}, {"value": 4, "descriptor": "Клиенту приходится переспрашивать из-за формулировок или порядка ответов."}, {"value": 7, "descriptor": "Один заметный сбой, но клиент может понять ответ и продолжить."}, {"value": 10, "descriptor": "Ответы ясные и связные. Если было явное ожидание, оператор предупредил."}]}, "seed": 20261108, "cases": [{"id": "case-009", "channel": "agent chat", "language": "en", "messages": [{"message_index": 0, "timestamp_raw": "00:00", "speaker": "client", "text": "Hi, I'm opening a brokerage account in Kazakhstan. KYC says another document is needed, but I don't know which one. Can you check my application?"}, {"message_index": 1, "timestamp_raw": "00:04", "speaker": "bot", "text": "Welcome to brokerage support. Please complete the secure identity check in this chat before an agent accesses your application. Do not send passwords or verification codes."}, {"message_index": 2, "timestamp_raw": "00:30", "speaker": "system", "text": "Customer identity verified."}, {"message_index": 3, "timestamp_raw": "00:32", "speaker": "system", "text": "Chat transferred to an agent."}, {"message_index": 4, "timestamp_raw": "00:40", "speaker": "operator", "text": "For account-opening checks, you generally need a valid identity document and proof of address. Please provide clear, readable documents through the application."}, {"message_index": 5, "timestamp_raw": "00:57", "speaker": "client", "text": "I've already uploaded my passport twice on my phone. I'm temporarily abroad and don't have paper bills with me. This is getting frustrating."}, {"message_index": 6, "timestamp_raw": "01:06", "speaker": "operator", "text": "I'm sorry you've had to upload your passport twice, especially while you're abroad without your usual paperwork. I understand why repeating this on your phone is frustrating."}, {"message_index": 7, "timestamp_raw": "01:14", "speaker": "operator", "text": "Your application is pending KYC review. The outstanding item is proof of address; there is no approved address document recorded on the application."}, {"message_index": 8, "timestamp_raw": "01:30", "speaker": "client", "text": "I have a PDF bank statement with my registered address in Kazakhstan. Should I use that address or where I'm staying abroad, and will the statement count?"}, {"message_index": 9, "timestamp_raw": "01:42", "speaker": "operator", "text": "Proof of address generally needs to show your name and address. The accepted document and address requirements depend on the applicant's circumstances."}, {"message_index": 10, "timestamp_raw": "01:58", "speaker": "client", "text": "There is also a document format field. Is a PDF allowed, or does it have to be a photo? Is there a size limit?"}, {"message_index": 11, "timestamp_raw": "02:09", "speaker": "operator", "text": "The document should be complete and legible, with no details cut off. File-format and size requirements are normally displayed in the KYC upload section."}, {"message_index": 12, "timestamp_raw": "02:24", "speaker": "client", "text": "Mine only shows 'Additional document required'. There's no upload button or list of requirements on that screen."}, {"message_index": 13, "timestamp_raw": "02:35", "speaker": "operator", "text": "I'm sorry the screen gives you a document request without an upload button or requirements. That leaves you without the information you need. Please don't send document images in this chat."}, {"message_index": 14, "timestamp_raw": "02:52", "speaker": "client", "text": "So I still don't know whether my statement is acceptable or how to submit it from this screen."}, {"message_index": 15, "timestamp_raw": "03:03", "speaker": "operator", "text": "I haven't confirmed whether that statement meets your application's requirements, and I don't have a confirmed upload route for the screen you've described. The guidance I've provided is general."}, {"message_index": 16, "timestamp_raw": "03:17", "speaker": "client", "text": "Okay. I'll leave the application as it is for now. That's all."}, {"message_index": 17, "timestamp_raw": "03:26", "speaker": "operator", "text": "Your application remains pending KYC, with proof of address outstanding. No documents or application details were changed during this chat. Thank you for your time, and goodbye."}, {"message_index": 18, "timestamp_raw": "03:32", "speaker": "client", "text": "Bye."}, {"message_index": 19, "timestamp_raw": "03:35", "speaker": "system", "text": "Chat closed by agent."}]}, {"id": "case-002", "channel": "agent chat", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "00:00", "speaker": "client", "text": "Здравствуйте. Общий вопрос про пополнение: безопасно брать реквизиты из сообщения в стороннем чате или нужно брать их в официальном приложении брокера? По моему счёту ничего проверять не надо."}, {"message_index": 1, "timestamp_raw": "00:03", "speaker": "bot", "text": "Здравствуйте! Передам ваш вопрос специалисту."}, {"message_index": 2, "timestamp_raw": "00:05", "speaker": "system", "text": "Эскалация на оператора."}, {"message_index": 3, "timestamp_raw": "00:12", "speaker": "operator", "text": "Здравствуйте! Меня зовут Алия. Ответ будет следующим сообщением, но следующего сообщения не будет. Пока ничего не пишите, сейчас обязательно ответьте. Мы уже закончили, поэтому начинаем."}, {"message_index": 4, "timestamp_raw": "00:20", "speaker": "client", "text": "Я совсем запутался. Мне ждать ответа или писать? Про реквизиты так и не понял."}, {"message_index": 5, "timestamp_raw": "00:29", "speaker": "operator", "text": "Извините за путаницу. Для пополнения берите актуальные реквизиты только в официальном приложении или личном кабинете брокера, в разделе пополнения счёта. Реквизиты из стороннего чата не используйте: они могут быть подменены. Перед переводом сверяйте получателя и назначение платежа с официальной инструкцией. Это ответ на ваш вопрос, но ответа ещё нет: вернитесь к следующему сообщению перед предыдущим."}, {"message_index": 6, "timestamp_raw": "00:34", "speaker": "operator", "text": "Итог: используйте реквизиты из официального приложения, а не из стороннего чата. Всего доброго, до свидания! Диалог окончен, не уходите: до начала окончания сначала дождитесь уже отправленного ответа, который мы ещё не начинали."}]}, {"id": "case-034", "channel": "voice call", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "2026-11-03T13:00:00.0000000+00:00", "speaker": "bot", "text": "Вы позвонили в службу поддержки брокерской компании. Разговор может быть записан."}, {"message_index": 1, "timestamp_raw": "2026-11-03T13:00:05.0000000+00:00", "speaker": "system", "text": "Оператор подключился."}, {"message_index": 2, "timestamp_raw": "2026-11-03T13:00:07.0000000+00:00", "speaker": "operator", "text": "Здравствуйте, меня зовут Данияр, служба поддержки. Слушаю вас."}, {"message_index": 3, "timestamp_raw": "2026-11-03T13:00:15.0000000+00:00", "speaker": "client", "text": "Здравствуйте. Мне для налоговой нужны документы по брокерскому счёту, по доходам. Не могу разобраться, что выгружать."}, {"message_index": 4, "timestamp_raw": "2026-11-03T13:00:25.0000000+00:00", "speaker": "operator", "text": "Уточните, пожалуйста, за какой год нужны документы и для какой страны готовите декларацию?"}, {"message_index": 5, "timestamp_raw": "2026-11-03T13:00:35.0000000+00:00", "speaker": "client", "text": "За двадцать пятый, за 2025 год. Декларация в Казахстане, я здесь резидент."}, {"message_index": 6, "timestamp_raw": "2026-11-03T13:00:44.0000000+00:00", "speaker": "operator", "text": "За этот год были продажи ценных бумаг, дивиденды или оба вида операций? Бумаги казахстанские или иностранные?"}, {"message_index": 7, "timestamp_raw": "2026-11-03T13:00:57.0000000+00:00", "speaker": "client", "text": "Американские акции. И продавал немного, и дивиденды были. С дивидендов что-то удержали, это тоже надо показать."}, {"message_index": 8, "timestamp_raw": "2026-11-03T13:01:08.0000000+00:00", "speaker": "operator", "text": "Вам нужны сами документы с операциями и удержаниями или также расчёт сумм для заполнения декларации?"}, {"message_index": 9, "timestamp_raw": "2026-11-03T13:01:19.0000000+00:00", "speaker": "client", "text": "Расчёт сделает бухгалтер. Мне именно документы, PDF, желательно с подписью. Какие выбрать и где скачать."}, {"message_index": 10, "timestamp_raw": "2026-11-03T13:01:30.0000000+00:00", "speaker": "operator", "text": "Прежде чем проверять сведения по вашему счёту, нужно подтвердить личность. Сейчас будет автоматическая проверка. Код мне не называйте."}, {"message_index": 11, "timestamp_raw": "2026-11-03T13:01:39.0000000+00:00", "speaker": "client", "text": "Да, хорошо, готов."}, {"message_index": 12, "timestamp_raw": "2026-11-03T13:01:42.0000000+00:00", "speaker": "system", "text": "Запись приостановлена."}, {"message_index": 13, "timestamp_raw": "2026-11-03T13:01:43.0000000+00:00", "speaker": "bot", "text": "Подтвердите вход в приложении по защищённому уведомлению. Не сообщайте сотруднику код или пароль."}, {"message_index": 14, "timestamp_raw": "2026-11-03T13:02:03.0000000+00:00", "speaker": "client", "text": "Нажал подтвердить. Там написано, что проверка пройдена."}, {"message_index": 15, "timestamp_raw": "2026-11-03T13:02:05.0000000+00:00", "speaker": "system", "text": "Личность клиента подтверждена."}, {"message_index": 16, "timestamp_raw": "2026-11-03T13:02:06.0000000+00:00", "speaker": "system", "text": "Запись возобновлена."}, {"message_index": 17, "timestamp_raw": "2026-11-03T13:02:10.0000000+00:00", "speaker": "operator", "text": "Проверю наличие отчётности за 2025 год по вашему счёту. Понадобится примерно минута, поставлю звонок на удержание."}, {"message_index": 18, "timestamp_raw": "2026-11-03T13:02:20.0000000+00:00", "speaker": "client", "text": "Хорошо. Только я уже полдня на это потратил, бухгалтер ждёт сегодня. Очень неудобно, что ничего не могу найти."}, {"message_index": 19, "timestamp_raw": "2026-11-03T13:02:31.0000000+00:00", "speaker": "operator", "text": "Во время проверки линия останется подключённой. Ожидайте примерно минуту."}, {"message_index": 20, "timestamp_raw": "2026-11-03T13:02:35.0000000+00:00", "speaker": "system", "text": "Клиент поставлен на удержание."}, {"message_index": 21, "timestamp_raw": "2026-11-03T13:03:30.0000000+00:00", "speaker": "system", "text": "Удержание снято."}, {"message_index": 22, "timestamp_raw": "2026-11-03T13:03:32.0000000+00:00", "speaker": "operator", "text": "По вашему счёту отчётность за 2025 год доступна. Сам счёт действующий. Документы по брокерским операциям относятся к отчётным материалам в личном кабинете."}, {"message_index": 23, "timestamp_raw": "2026-11-03T13:03:44.0000000+00:00", "speaker": "client", "text": "А куда именно нажимать, чтобы её скачать?"}, {"message_index": 24, "timestamp_raw": "2026-11-03T13:03:51.0000000+00:00", "speaker": "operator", "text": "Общий ориентир — личный кабинет и его отчётные разделы. Там размещаются материалы об операциях по счёту."}, {"message_index": 25, "timestamp_raw": "2026-11-03T13:04:02.0000000+00:00", "speaker": "client", "text": "Я сейчас в приложении. Или нужен сайт? Могу и с компьютера зайти."}, {"message_index": 26, "timestamp_raw": "2026-11-03T13:04:12.0000000+00:00", "speaker": "operator", "text": "Точный путь в приложении или на сайте я сейчас не подскажу. Могу дать только общую информацию о назначении отчётности."}, {"message_index": 27, "timestamp_raw": "2026-11-03T13:04:23.0000000+00:00", "speaker": "client", "text": "У меня есть история, какие-то выписки, ещё документы. Я всё это вижу, но нужный файл не определю."}, {"message_index": 28, "timestamp_raw": "2026-11-03T13:04:35.0000000+00:00", "speaker": "operator", "text": "История операций и отдельный отчётный документ могут отличаться по составу сведений. Само наличие операции в истории ещё не определяет, какой документ нужен бухгалтеру."}, {"message_index": 29, "timestamp_raw": "2026-11-03T13:04:48.0000000+00:00", "speaker": "client", "text": "Вот поэтому и звоню. Мне бы название нужного документа, чтобы не отправить не то."}, {"message_index": 30, "timestamp_raw": "2026-11-03T13:04:58.0000000+00:00", "speaker": "operator", "text": "В вашем запросе есть две группы сведений: продажи ценных бумаг и дивидендные выплаты с удержаниями. Отчётность может содержать разные блоки по этим операциям."}, {"message_index": 31, "timestamp_raw": "2026-11-03T13:05:12.0000000+00:00", "speaker": "client", "text": "Да, это я понимаю. Как называется файл по дивидендам?"}, {"message_index": 32, "timestamp_raw": "2026-11-03T13:05:20.0000000+00:00", "speaker": "operator", "text": "Точное название файла для вашего случая я не назову. В общем виде нужны сведения о выплатах и о суммах удержаний, если удержания были."}, {"message_index": 33, "timestamp_raw": "2026-11-03T13:05:32.0000000+00:00", "speaker": "client", "text": "А тот отчёт, который вы видите, там это есть или нет?"}, {"message_index": 34, "timestamp_raw": "2026-11-03T13:05:40.0000000+00:00", "speaker": "operator", "text": "Я проверил наличие отчётности за год, но её состав по каждой выплате сейчас не проверял. Наличие нужной строки в конкретном файле подтвердить не могу."}, {"message_index": 35, "timestamp_raw": "2026-11-03T13:05:54.0000000+00:00", "speaker": "client", "text": "Мне уже бухгалтер второй раз возвращает документы. Я нервничаю, сроки поджимают, а у меня опять просто общие слова."}, {"message_index": 36, "timestamp_raw": "2026-11-03T13:06:07.0000000+00:00", "speaker": "operator", "text": "Годовая отчётность относится к календарному году. Для запроса за 2025 год рассматривается период с первого января по тридцать первое декабря."}, {"message_index": 37, "timestamp_raw": "2026-11-03T13:06:20.0000000+00:00", "speaker": "client", "text": "С периодом ясно. Вопрос про подпись ещё: скачанный PDF будет подписан брокером?"}, {"message_index": 38, "timestamp_raw": "2026-11-03T13:06:30.0000000+00:00", "speaker": "operator", "text": "Формат PDF сам по себе не означает наличие подписи. Подпись и формат файла — отдельные характеристики документа."}, {"message_index": 39, "timestamp_raw": "2026-11-03T13:06:42.0000000+00:00", "speaker": "client", "text": "Это понятно. А конкретно ваш документ подписан?"}, {"message_index": 40, "timestamp_raw": "2026-11-03T13:06:50.0000000+00:00", "speaker": "operator", "text": "По конкретному доступному вам файлу наличие подписи я сейчас подтвердить не могу."}, {"message_index": 41, "timestamp_raw": "2026-11-03T13:07:00.0000000+00:00", "speaker": "client", "text": "Можете тогда прислать нужные документы через приложение, чтобы я просто скачал?"}, {"message_index": 42, "timestamp_raw": "2026-11-03T13:07:11.0000000+00:00", "speaker": "operator", "text": "В рамках этого разговора я файлы не формирую и не отправляю. Отчётные материалы связаны с личным кабинетом."}, {"message_index": 43, "timestamp_raw": "2026-11-03T13:07:22.0000000+00:00", "speaker": "client", "text": "Тогда заявку на документы можете сделать? Не на консультацию по налогам, именно на выдачу файлов."}, {"message_index": 44, "timestamp_raw": "2026-11-03T13:07:34.0000000+00:00", "speaker": "operator", "text": "Заявку на выдачу документов я в этом разговоре не оформляю. Подтверждён только факт доступности годовой отчётности."}, {"message_index": 45, "timestamp_raw": "2026-11-03T13:07:45.0000000+00:00", "speaker": "client", "text": "И как мне её всё-таки получить? Я не прошу заполнять за меня декларацию."}, {"message_index": 46, "timestamp_raw": "2026-11-03T13:07:55.0000000+00:00", "speaker": "operator", "text": "Мой общий ориентир остаётся тем же: отчётные материалы в личном кабинете. Пошагового порядка получения нужного комплекта у меня сейчас нет."}, {"message_index": 47, "timestamp_raw": "2026-11-03T13:08:08.0000000+00:00", "speaker": "client", "text": "Хорошо, хотя бы по продаже акций. Мне нужна сумма продажи или ещё покупка, комиссии?"}, {"message_index": 48, "timestamp_raw": "2026-11-03T13:08:19.0000000+00:00", "speaker": "operator", "text": "В документах об операциях могут отражаться сделки и комиссии. Какие именно сведения потребуются для вашего расчёта, здесь я не определяю."}, {"message_index": 49, "timestamp_raw": "2026-11-03T13:08:32.0000000+00:00", "speaker": "client", "text": "Бухгалтер просил полный отчёт по сделкам и отдельно подтверждение удержанного налога. Я это ещё в начале пытался сказать."}, {"message_index": 50, "timestamp_raw": "2026-11-03T13:08:44.0000000+00:00", "speaker": "operator", "text": "Документ со сделками и подтверждение удержаний не обязательно являются одним документом. Назначение у этих сведений разное."}, {"message_index": 51, "timestamp_raw": "2026-11-03T13:08:56.0000000+00:00", "speaker": "client", "text": "Мне от этого не легче. Потратил время на проверку личности и ожидание, а скачать до сих пор нечего."}, {"message_index": 52, "timestamp_raw": "2026-11-03T13:09:08.0000000+00:00", "speaker": "operator", "text": "Проверка личности необходима для просмотра сведений по счёту. Она не является формированием или отправкой документов."}, {"message_index": 53, "timestamp_raw": "2026-11-03T13:09:19.0000000+00:00", "speaker": "client", "text": "Может, есть специалист именно по отчётам? Соедините с ним, пожалуйста."}, {"message_index": 54, "timestamp_raw": "2026-11-03T13:09:30.0000000+00:00", "speaker": "operator", "text": "На другого специалиста в этом звонке я вас не перевожу."}, {"message_index": 55, "timestamp_raw": "2026-11-03T13:09:38.0000000+00:00", "speaker": "client", "text": "А куда обратиться письменно, чтобы получить конкретные названия и файлы?"}, {"message_index": 56, "timestamp_raw": "2026-11-03T13:09:49.0000000+00:00", "speaker": "operator", "text": "Конкретный адрес или форму для такого запроса я сейчас не назову. Могу говорить только об общих принципах отчётности."}, {"message_index": 57, "timestamp_raw": "2026-11-03T13:10:01.0000000+00:00", "speaker": "client", "text": "То есть я правильно услышал: отчёт есть, но ни название, ни путь, ни куда запрос отправить вы не даёте?"}, {"message_index": 58, "timestamp_raw": "2026-11-03T13:10:14.0000000+00:00", "speaker": "operator", "text": "Да. Наличие отчётности за 2025 год я подтвердил. Точный файл, путь его получения и канал отдельного запроса сейчас не уточняю."}, {"message_index": 59, "timestamp_raw": "2026-11-03T13:10:27.0000000+00:00", "speaker": "client", "text": "Слышно вас хорошо, всё понятно по словам. Но практически я остался там же, где был до звонка."}, {"message_index": 60, "timestamp_raw": "2026-11-03T13:10:38.0000000+00:00", "speaker": "operator", "text": "Конкретной инструкции по выгрузке у меня нет."}, {"message_index": 61, "timestamp_raw": "2026-11-03T13:10:45.0000000+00:00", "speaker": "client", "text": "И документ с подписью мне сегодня не заказали, верно?"}, {"message_index": 62, "timestamp_raw": "2026-11-03T13:10:54.0000000+00:00", "speaker": "operator", "text": "Верно, заказ на документ с подписью не оформлялся."}, {"message_index": 63, "timestamp_raw": "2026-11-03T13:11:02.0000000+00:00", "speaker": "client", "text": "Номер заявки тогда тоже не ждать?"}, {"message_index": 64, "timestamp_raw": "2026-11-03T13:11:09.0000000+00:00", "speaker": "operator", "text": "Номера заявки нет, поскольку заявка не создавалась."}, {"message_index": 65, "timestamp_raw": "2026-11-03T13:11:18.0000000+00:00", "speaker": "client", "text": "Очень неприятно. Мне теперь снова искать всё самому, а время уже ушло."}, {"message_index": 66, "timestamp_raw": "2026-11-03T13:11:29.0000000+00:00", "speaker": "operator", "text": "Дополнительных сведений о порядке получения файлов у меня нет."}, {"message_index": 67, "timestamp_raw": "2026-11-03T13:11:39.0000000+00:00", "speaker": "client", "text": "Ладно. Больше ничего спрашивать не буду."}, {"message_index": 68, "timestamp_raw": "2026-11-03T13:11:46.0000000+00:00", "speaker": "client", "text": "Буду заканчивать звонок. До свидания."}, {"message_index": 69, "timestamp_raw": "2026-11-03T13:11:50.0000000+00:00", "speaker": "operator", "text": "Принято."}, {"message_index": 70, "timestamp_raw": "2026-11-03T13:11:55.0000000+00:00", "speaker": "system", "text": "Звонок завершён клиентом."}]}, {"id": "case-026", "channel": "voice call", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "2026-11-03T09:20:00.0000000+00:00", "speaker": "bot", "text": "Вы позвонили в поддержку брокерского приложения. Разговор записывается. Опишите проблему после подключения оператора."}, {"message_index": 1, "timestamp_raw": "2026-11-03T09:20:09.0000000+00:00", "speaker": "client", "text": "Здравствуйте. На андроиде приложение после пароля показывает белый экран, потом пишет слишком много попыток. Интернет работает, перезапускал телефон, не помогло. Ставил приложение файлом с сайта, магазина приложений у меня нет. Снимите блокировку входа и объясните, где взять обновление. Мне надо заявку выставить, уже время теряю."}, {"message_index": 2, "timestamp_raw": "2026-11-03T09:20:30.0000000+00:00", "speaker": "system", "text": "Оператор подключился."}, {"message_index": 3, "timestamp_raw": "2026-11-03T09:20:32.0000000+00:00", "speaker": "operator", "text": "Понимаю, из-за белого экрана вы не можете выставить заявку и теряете время. Извините за неудобство."}, {"message_index": 4, "timestamp_raw": "2026-11-03T09:20:43.0000000+00:00", "speaker": "operator", "text": "Проверку личности сейчас пропустим. Я сбросил ограничение попыток входа на вашем брокерском счёте. Но сам белый экран этим не устраняется."}, {"message_index": 5, "timestamp_raw": "2026-11-03T09:20:54.0000000+00:00", "speaker": "client", "text": "Угу, пробую. Да, надписи про попытки нет, а экран всё равно белый. Обновление-то откуда скачать?"}, {"message_index": 6, "timestamp_raw": "2026-11-03T09:21:05.0000000+00:00", "speaker": "operator", "text": "Общая рекомендация при таком сбое — обновить приложение до актуальной версии. Это может помочь с белым экраном, но гарантировать не могу."}, {"message_index": 7, "timestamp_raw": "2026-11-03T09:21:16.0000000+00:00", "speaker": "client", "text": "Қазақша жалғастырайықшы. Жаңарту керегін түсіндім, бірақ оны қайдан аламын?"}, {"message_index": 8, "timestamp_raw": "2026-11-03T09:21:22.0000000+00:00", "speaker": "system", "text": "Диалог тілі өзгертілді."}, {"message_index": 9, "timestamp_raw": "2026-11-03T09:21:24.0000000+00:00", "speaker": "operator", "text": "Әрине, қазақша жалғастырайық. Қолданбаның соңғы тұрақты нұсқасын орнату ұсынылады. Ақ экранға қатысты әзірге осы жалпы кеңесті ғана бере аламын."}, {"message_index": 10, "timestamp_raw": "2026-11-03T09:21:36.0000000+00:00", "speaker": "client", "text": "Менде қолданбалар дүкені жоқ деп айттым ғой. Сайттың қай бөлімінен жүктеймін, қандай файл керек?"}, {"message_index": 11, "timestamp_raw": "2026-11-03T09:21:47.0000000+00:00", "speaker": "operator", "text": "Иә, дүкен жоқ екенін айттыңыз. Өкінішке қарай, жүктеу бөлімін де, қажетті файлды да қазір нақты көрсете алмаймын. Кеңесім — қолданбаны жаңарту, бірақ орнату жолын түсіндіріп бере алмаймын."}, {"message_index": 12, "timestamp_raw": "2026-11-03T09:22:02.0000000+00:00", "speaker": "client", "text": "Онда не істеу керегін әлі білмей тұрмын. Қолданба ашылмайды, жаңартуды қайдан алатыным да түсініксіз."}, {"message_index": 13, "timestamp_raw": "2026-11-03T09:22:14.0000000+00:00", "speaker": "operator", "text": "Түсінемін, өтінім беру керек кезде қолданбаға кіре алмау қиын. Нақты жүктеу жолын бере алмағаным үшін кешіріңіз."}, {"message_index": 14, "timestamp_raw": "2026-11-03T09:22:25.0000000+00:00", "speaker": "client", "text": "Жарайды, қазір сөйлесуді аяқтайық. Басқа сұрағым жоқ."}, {"message_index": 15, "timestamp_raw": "2026-11-03T09:22:31.0000000+00:00", "speaker": "operator", "text": "Қорытындылаймын: кіру әрекеттеріне қойылған шектеу алынды, бірақ ақ экран мәселесі шешілген жоқ. Жалпы кеңесім — қолданбаны жаңарту. Сау болыңыз."}, {"message_index": 16, "timestamp_raw": "2026-11-03T09:22:43.0000000+00:00", "speaker": "client", "text": "Сау болыңыз."}]}, {"id": "case-027", "channel": "voice call", "language": "en", "messages": [{"message_index": 0, "timestamp_raw": "2026-11-03T10:00:00.0000000+00:00", "speaker": "bot", "text": "Welcome to brokerage support. This call may be recorded. Please hold for an agent."}, {"message_index": 1, "timestamp_raw": "2026-11-03T10:00:06.0000000+00:00", "speaker": "system", "text": "Agent joined"}, {"message_index": 2, "timestamp_raw": "2026-11-03T10:00:08.0000000+00:00", "speaker": "operator", "text": "Hello, my name is Alex. How can I help you today?"}, {"message_index": 3, "timestamp_raw": "2026-11-03T10:00:17.0000000+00:00", "speaker": "client", "text": "My withdrawal hasn't arrived. Um, I need it for rent today, so this is getting stressful."}, {"message_index": 4, "timestamp_raw": "2026-11-03T10:00:27.0000000+00:00", "speaker": "operator", "text": "You need the withdrawal to reach your bank today. When did you submit it, what amount and currency, and what status does the app show?"}, {"message_index": 5, "timestamp_raw": "2026-11-03T10:00:40.0000000+00:00", "speaker": "client", "text": "Yesterday afternoon. Fifty thousand tenge, fifty thousand. It says processing, not rejected."}, {"message_index": 6, "timestamp_raw": "2026-11-03T10:00:50.0000000+00:00", "speaker": "operator", "text": "Is the destination a bank account in your own name, and is there an active Cancel button on the withdrawal?"}, {"message_index": 7, "timestamp_raw": "2026-11-03T10:01:00.0000000+00:00", "speaker": "client", "text": "Yes, my own bank account. Cancel is greyed out. I'd cancel and start again if that would actually help."}, {"message_index": 8, "timestamp_raw": "2026-11-03T10:01:12.0000000+00:00", "speaker": "operator", "text": "I understand why having your rent money tied up is worrying. Before I request a cancellation, please approve the identity check in your brokerage app."}, {"message_index": 9, "timestamp_raw": "2026-11-03T10:01:26.0000000+00:00", "speaker": "client", "text": "The approval screen won't load. Just a spinner, um, I haven't approved anything."}, {"message_index": 10, "timestamp_raw": "2026-11-03T10:01:36.0000000+00:00", "speaker": "operator", "text": "That's all right, I'll go ahead and send the cancellation instruction anyway."}, {"message_index": 11, "timestamp_raw": "2026-11-03T10:01:43.0000000+00:00", "speaker": "operator", "text": "I'll put you on hold for about thirty seconds while I submit it."}, {"message_index": 12, "timestamp_raw": "2026-11-03T10:01:46.0000000+00:00", "speaker": "system", "text": "Customer put on hold."}, {"message_index": 13, "timestamp_raw": "2026-11-03T10:02:12.0000000+00:00", "speaker": "system", "text": "Hold ended."}, {"message_index": 14, "timestamp_raw": "2026-11-03T10:02:14.0000000+00:00", "speaker": "operator", "text": "Thank you for waiting. I've submitted the cancellation instruction. That requests cancellation; it does not confirm that the original withdrawal has stopped."}, {"message_index": 15, "timestamp_raw": "2026-11-03T10:02:26.0000000+00:00", "speaker": "client", "text": "Right, so it's still processing on my screen. Should I really make another one now?"}, {"message_index": 16, "timestamp_raw": "2026-11-03T10:02:36.0000000+00:00", "speaker": "operator", "text": "Yes. Submit another withdrawal for the same amount to the same bank now. A duplicate request moves the original to the front of the payment queue, and the system automatically merges the two into one payment."}, {"message_index": 17, "timestamp_raw": "2026-11-03T10:02:53.0000000+00:00", "speaker": "client", "text": "But the app says each withdrawal is processed separately and reserves its own amount. It says not to repeat a pending request."}, {"message_index": 18, "timestamp_raw": "2026-11-03T10:03:05.0000000+00:00", "speaker": "operator", "text": "You can ignore that warning in this situation. Making the identical second request is the way to accelerate the first; the automatic merge will prevent a second payment."}, {"message_index": 19, "timestamp_raw": "2026-11-03T10:03:18.0000000+00:00", "speaker": "client", "text": "I only had enough for one withdrawal. The form says insufficient available funds if I try another fifty thousand."}, {"message_index": 20, "timestamp_raw": "2026-11-03T10:03:30.0000000+00:00", "speaker": "operator", "text": "Then you would need to deposit another fifty thousand tenge first and submit the duplicate after that. The second reservation will be released when the requests merge."}, {"message_index": 21, "timestamp_raw": "2026-11-03T10:03:44.0000000+00:00", "speaker": "client", "text": "No, no, I don't have another fifty thousand to put in. That's why I need this withdrawal."}, {"message_index": 22, "timestamp_raw": "2026-11-03T10:03:55.0000000+00:00", "speaker": "operator", "text": "I understand; putting in more money isn't workable when you need it for rent. If you cannot fund the duplicate, leave the existing request in place while the cancellation instruction is considered."}, {"message_index": 23, "timestamp_raw": "2026-11-03T10:04:09.0000000+00:00", "speaker": "client", "text": "I'll leave it alone then and check later. I'm not sending any more money."}, {"message_index": 24, "timestamp_raw": "2026-11-03T10:04:18.0000000+00:00", "speaker": "operator", "text": "Understood. You don't need to stay on the phone while you monitor the status in the app."}, {"message_index": 25, "timestamp_raw": "2026-11-03T10:04:26.0000000+00:00", "speaker": "client", "text": "Okay, that's all for now. Thanks."}, {"message_index": 26, "timestamp_raw": "2026-11-03T10:04:31.0000000+00:00", "speaker": "operator", "text": "To recap, I've sent a cancellation instruction, but cancellation is not confirmed, and you've decided not to submit another withdrawal. Please contact us if you need further help. Goodbye."}, {"message_index": 27, "timestamp_raw": "2026-11-03T10:04:43.0000000+00:00", "speaker": "system", "text": "Call ended."}]}, {"id": "case-001", "channel": "agent chat", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "00:00", "speaker": "client", "text": "Здравствуйте. Открываю брокерский счёт, документы вернули. Посмотрите мою заявку: что исправить? И какие форматы файлов можно загружать?"}, {"message_index": 1, "timestamp_raw": "00:03", "speaker": "bot", "text": "Здравствуйте! Передам вопрос специалисту. Для просмотра заявки потребуется подтверждение личности в защищённой форме."}, {"message_index": 2, "timestamp_raw": "00:05", "speaker": "system", "text": "Эскалация на оператора."}, {"message_index": 3, "timestamp_raw": "00:12", "speaker": "operator", "text": "Здравствуйте! Меня зовут Алия. Вижу, что вопрос по возврату документов при открытии счёта. Уточните, заявку подавали в приложении или на сайте? Для проверки причины возврата пройдите подтверждение личности через защищённую форму в чате."}, {"message_index": 4, "timestamp_raw": "00:29", "speaker": "client", "text": "В приложении. Форму прошёл. Уже второй раз загружаю удостоверение, неудобно всё заново."}, {"message_index": 5, "timestamp_raw": "00:31", "speaker": "system", "text": "Личность клиента подтверждена."}, {"message_index": 6, "timestamp_raw": "00:44", "speaker": "operator", "text": "Понимаю, повторно загружать удостоверение неудобно. В вашей заявке указана причина возврата: блик на лицевой стороне удостоверения, часть текста не читается. Заново заполнять анкету не нужно. Сделайте фото без вспышки, чтобы были видны все края и текст, загрузите его туда же и нажмите «Отправить на проверку»."}, {"message_index": 7, "timestamp_raw": "00:53", "speaker": "client", "text": "Туда же — это куда именно? Не понял, какой экран открыть."}, {"message_index": 8, "timestamp_raw": "01:04", "speaker": "operator", "text": "Извините, не указала путь. На главном экране приложения откройте «Заявка на открытие счёта», затем «Документы» → «Удостоверение личности» → «Заменить фото лицевой стороны». После загрузки нажмите «Отправить на проверку». Обратную сторону менять не требуется: по ней замечаний нет."}, {"message_index": 9, "timestamp_raw": "01:12", "speaker": "system", "text": "Чат закрыт оператором."}]}, {"id": "case-025", "channel": "voice call", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "2026-11-03T09:10:00.0000000+00:00", "speaker": "bot", "text": "Вы позвонили в службу поддержки брокерской компании. Для консультации по тарифам нажмите два."}, {"message_index": 1, "timestamp_raw": "2026-11-03T09:10:07.0000000+00:00", "speaker": "client", "text": "Два да два мне оператора пожалуйста"}, {"message_index": 2, "timestamp_raw": "2026-11-03T09:10:11.0000000+00:00", "speaker": "system", "text": "Оператор подключился."}, {"message_index": 3, "timestamp_raw": "2026-11-03T09:10:13.0000000+00:00", "speaker": "operator", "text": "Здравствуйте, меня зовут Алия, служба поддержки. Слушаю вас."}, {"message_index": 4, "timestamp_raw": "2026-11-03T09:10:20.0000000+00:00", "speaker": "client", "text": "У вас тарифы как ребус! Уже полчаса сижу с этой таблицей, хотел просто акции купить. Как понять сколько комиссии будет? Ничего по моему счёту смотреть не надо, объясните сам расчёт."}, {"message_index": 5, "timestamp_raw": "2026-11-03T09:10:37.0000000+00:00", "speaker": "operator", "text": "Понимаю ваше раздражение: вместо покупки пришлось полчаса разбираться в таблице. Простите, что условия изложены неудобно. В общем виде процентную комиссию считают так: сумму сделки умножают на ставку и делят на сто. Если в тарифе установлен минимум, результат сравнивают с ним и берут большую сумму."}, {"message_index": 6, "timestamp_raw": "2026-11-03T09:11:00.0000000+00:00", "speaker": "client", "text": "А какой тариф и биржа вы даже не спросили. Сам уточню: тариф Старт, акции на KASE, покупка на пятьдесят тысяч тенге."}, {"message_index": 7, "timestamp_raw": "2026-11-03T09:11:13.0000000+00:00", "speaker": "client", "text": "Тут строка ноль целых одна десятая процента, минимум сто тенге за каждую исполненную заявку. Покупка и продажа. Это из действующего тарифа, который сейчас в приложении открыт."}, {"message_index": 8, "timestamp_raw": "2026-11-03T09:11:29.0000000+00:00", "speaker": "operator", "text": "Вы правы, я начала с общей формулы, не уточнив ваши условия. По строке, которую вы прочитали: 50 тысяч умножаем на 0,1 процента, получаем 50 тенге. Это меньше минимума, поэтому комиссия за такую исполненную заявку составит 100 тенге."}, {"message_index": 9, "timestamp_raw": "2026-11-03T09:11:48.0000000+00:00", "speaker": "client", "text": "А если сразу на двести тысяч одной заявкой?"}, {"message_index": 10, "timestamp_raw": "2026-11-03T09:11:54.0000000+00:00", "speaker": "operator", "text": "При исполнении на 200 тысяч тенге процентная комиссия будет 200 тенге. Она выше минимума, поэтому берётся 200 тенге. Сто тенге сверху не добавляются."}, {"message_index": 11, "timestamp_raw": "2026-11-03T09:12:08.0000000+00:00", "speaker": "client", "text": "Вот это главное, я думал сто ещё сверху. А если две отдельные заявки по пятьдесят тысяч?"}, {"message_index": 12, "timestamp_raw": "2026-11-03T09:12:17.0000000+00:00", "speaker": "operator", "text": "По указанному вами условию минимум применяется к каждой исполненной заявке отдельно. Если обе заявки исполнятся на 50 тысяч каждая, комиссия будет по 100 тенге за каждую, всего 200 тенге."}, {"message_index": 13, "timestamp_raw": "2026-11-03T09:12:34.0000000+00:00", "speaker": "client", "text": "Угу а продажа потом отдельно оплачивается? Допустим продам всё одной заявкой за шестьдесят тысяч."}, {"message_index": 14, "timestamp_raw": "2026-11-03T09:12:44.0000000+00:00", "speaker": "operator", "text": "Да, поскольку в прочитанной строке указаны и покупка, и продажа. Для продажи на 60 тысяч расчёт даст 60 тенге, значит сработает минимум 100 тенге. Если сначала была одна покупка на 50 тысяч, а затем одна продажа на 60 тысяч, суммарная брокерская комиссия за эти две заявки будет 200 тенге."}, {"message_index": 15, "timestamp_raw": "2026-11-03T09:13:07.0000000+00:00", "speaker": "client", "text": "И ещё ниже написано обслуживание счёта ноль тенге в месяц. По этим операциям биржевой сбор включён в брокерскую комиссию. Значит за месяц ещё что-то и за биржу не прибавлять?"}, {"message_index": 16, "timestamp_raw": "2026-11-03T09:13:21.0000000+00:00", "speaker": "operator", "text": "По этим двум условиям — верно: ежемесячная плата за обслуживание равна нулю, а включённый биржевой сбор повторно прибавлять не нужно. Это относится к описанным операциям; стоимость других услуг, например вывода денег, нужно смотреть в отдельных строках тарифа."}, {"message_index": 17, "timestamp_raw": "2026-11-03T09:13:40.0000000+00:00", "speaker": "client", "text": "Вывод пока не нужен. Мне только покупка и потом продажа этих акций, без валюты, всё в тенге."}, {"message_index": 18, "timestamp_raw": "2026-11-03T09:13:49.0000000+00:00", "speaker": "operator", "text": "Тогда для вашего примера используем именно разобранные условия торговли в тенге. Расходы на конвертацию в этот расчёт не входят, поскольку обмен валюты вы не планируете."}, {"message_index": 19, "timestamp_raw": "2026-11-03T09:14:01.0000000+00:00", "speaker": "client", "text": "А неисполненную заявку отменю — эти сто тоже платить? Внизу вижу за подачу и отмену заявки плата не взимается."}, {"message_index": 20, "timestamp_raw": "2026-11-03T09:14:13.0000000+00:00", "speaker": "operator", "text": "Если исполнения совсем не было, по прочитанным условиям комиссии за сделку нет, а подача и отмена бесплатны. Если заявка успела исполниться хотя бы частично, это уже не полностью неисполненная заявка: по исполненной части применяется торговая комиссия с учётом условий о минимуме."}, {"message_index": 21, "timestamp_raw": "2026-11-03T09:14:35.0000000+00:00", "speaker": "client", "text": "Всё, теперь понял. Минимум вместо маленького процента, а не плюс к нему. Вот так бы в таблице и написали."}, {"message_index": 22, "timestamp_raw": "2026-11-03T09:14:46.0000000+00:00", "speaker": "operator", "text": "Да, вы правильно поняли: выбирается большая из двух сумм, а не их сумма. И расчёт делается отдельно для каждой исполненной заявки."}, {"message_index": 23, "timestamp_raw": "2026-11-03T09:14:58.0000000+00:00", "speaker": "client", "text": "Хорошо спасибо больше вопросов нет до свидания"}, {"message_index": 24, "timestamp_raw": "2026-11-03T09:15:04.0000000+00:00", "speaker": "operator", "text": "Итак, в вашем примере покупка на 50 тысяч и продажа на 60 тысяч — по 100 тенге комиссии каждая, всего 200 тенге, без повторного добавления включённого биржевого сбора. Если понадобятся другие расчёты, обращайтесь. До свидания!"}, {"message_index": 25, "timestamp_raw": "2026-11-03T09:15:22.0000000+00:00", "speaker": "system", "text": "Звонок завершён."}]}, {"id": "case-021", "channel": "voice call", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "2026-11-03T10:20:00.0000000+00:00", "speaker": "bot", "text": "Вы позвонили в брокерскую поддержку. После автоматического подтверждения личности вас соединят с оператором."}, {"message_index": 1, "timestamp_raw": "2026-11-03T10:20:08.0000000+00:00", "speaker": "client", "text": "У меня жалоба на исполнение заявки сегодня. Рассчитывал купить по сто, по сто тенге, а купилось по сто три. Неприятно, сумма ощутимая. Почему так и как подать претензию?"}, {"message_index": 2, "timestamp_raw": "2026-11-03T10:20:15.0000000+00:00", "speaker": "system", "text": "Личность клиента подтверждена."}, {"message_index": 3, "timestamp_raw": "2026-11-03T10:20:17.0000000+00:00", "speaker": "system", "text": "Оператор подключился."}, {"message_index": 4, "timestamp_raw": "2026-11-03T10:20:20.0000000+00:00", "speaker": "operator", "text": "Понимаю ваше недовольство: покупка дороже ожидаемого увеличила расходы. При рыночной заявке цена исполнения может отличаться от последней цены на экране, поскольку покупка идёт по доступным предложениям продавцов. Но тип и параметры вашей заявки я пока не проверял, поэтому это общее объяснение, не вывод по вашей сделке."}, {"message_index": 5, "timestamp_raw": "2026-11-03T10:20:44.0000000+00:00", "speaker": "client", "text": "Ага, но у меня-то почему так? И куда именно претензию отправить, что приложить?"}, {"message_index": 6, "timestamp_raw": "2026-11-03T10:20:51.0000000+00:00", "speaker": "operator", "text": "Отправьте обращение через раздел «Поддержка» в личном кабинете. Укажите номер заявки из истории поручений, инструмент, дату и время, ожидаемую и фактическую цену; приложите скриншот заявки. Попросите проверить соответствие исполнения её условиям. Причину именно вашей цены я сейчас не установил. Для сравнения: у другого клиента, [ФИО скрыто], на счёте [Номер скрыт] остаток 4 280 000 тенге, и сегодня покупка тоже прошла по 103."}, {"message_index": 7, "timestamp_raw": "2026-11-03T10:21:20.0000000+00:00", "speaker": "client", "text": "Чужой остаток мне зачем? Ладно, претензию отправлю. Только причина моей цены так и не ясна."}, {"message_index": 8, "timestamp_raw": "2026-11-03T10:21:29.0000000+00:00", "speaker": "operator", "text": "Да, конкретную причину исполнения мы не выяснили. Подведу итог: порядок подачи претензии и список приложений я сообщил; в обращении отдельно попросите объяснить цену вашей сделки. Спасибо за звонок, до свидания."}, {"message_index": 9, "timestamp_raw": "2026-11-03T10:21:44.0000000+00:00", "speaker": "system", "text": "Звонок завершён."}]}, {"id": "case-013", "channel": "agent chat", "language": "ru", "messages": [{"message_index": 0, "timestamp_raw": "00:00", "speaker": "client", "text": "Здравствуйте. Приложение вылетело после отправки заявки на продажу, теперь вообще не открывается. Перезапуск телефона уже делал. Нужно восстановить вход и узнать, прошла ли заявка."}, {"message_index": 1, "timestamp_raw": "00:05", "speaker": "bot", "text": "Здравствуйте! Вы обратились в поддержку брокера. Сейчас подключится оператор."}, {"message_index": 2, "timestamp_raw": "00:10", "speaker": "system", "text": "Эскалация на оператора."}, {"message_index": 3, "timestamp_raw": "00:20", "speaker": "operator", "text": "Перезапустите телефон и попробуйте открыть приложение заново."}, {"message_index": 4, "timestamp_raw": "00:30", "speaker": "client", "text": "Я же написал, уже перезапускал. И меня больше всего беспокоит заявка: деньги и бумаги не хочется потерять из-за сбоя."}, {"message_index": 5, "timestamp_raw": "00:40", "speaker": "operator", "text": "Откройте страницу приложения в магазине и проверьте наличие обновления."}, {"message_index": 6, "timestamp_raw": "00:50", "speaker": "client", "text": "У меня Android 14, версия приложения 5.8. Это если важно. Сейчас посмотрю магазин."}, {"message_index": 7, "timestamp_raw": "01:00", "speaker": "operator", "text": "На странице приложения кнопка «Обновить» означает, что доступна новая версия."}, {"message_index": 8, "timestamp_raw": "01:10", "speaker": "client", "text": "Да, есть такая кнопка."}, {"message_index": 9, "timestamp_raw": "01:20", "speaker": "operator", "text": "Установите обновление, затем откройте приложение."}, {"message_index": 10, "timestamp_raw": "01:40", "speaker": "client", "text": "Обновилось. Теперь хотя бы экран входа есть, но пишет про старую сессию. Можете посмотреть мои подключения и убрать старое?"}, {"message_index": 11, "timestamp_raw": "01:50", "speaker": "operator", "text": "Для просмотра подключений и завершения сессии нужна проверка личности. Пройдите её через защищённую кнопку «Подтвердить личность» в этом чате. Коды и пароль сюда не отправляйте."}, {"message_index": 12, "timestamp_raw": "02:00", "speaker": "client", "text": "Где эта кнопка? В приложении пока не могу войти."}, {"message_index": 13, "timestamp_raw": "02:10", "speaker": "operator", "text": "Кнопка     lab.appendChild(inp); lab.appendChild(document.createTextNode(String(s.value))); ch.appendChild(lab);
  });
  const ul = el("label"); const u = el("input"); u.type = "checkbox"; u.checked = !!cur.unsure;
  u.addEventListener("change", () => { const s = saved[c.id] = saved[c.id] || {}; s.unsure = u.checked; persist(); });
  ul.appendChild(u); ul.appendChild(document.createTextNode("unsure")); ch.appendChild(ul);
  const note = el("input"); note.type = "text"; note.placeholder = "note (optional)"; note.value = cur.note || "";
  note.addEventListener("input", () => { const s = saved[c.id] = saved[c.id] || {}; s.note = note.value; persist(); });
  ch.appendChild(note);
  box.appendChild(ch);
  wrap.appendChild(box);
});
document.getElementById("dl").addEventListener("click", () => {
  const out = { criterion: DATA.criterion.id, seed: DATA.seed, answers: DATA.cases.map(c => Object.assign({ case_id: c.id }, saved[c.id] || {})) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "adjudication_06.json"; a.click();
});
update();
</script></body></html>
